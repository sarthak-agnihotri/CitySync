<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CitySync — National & Municipal Infrastructure Coordination Portal</title>
    <meta
      name="description"
      content="Unified data sharing, joint planning, and coordinated execution of urban infrastructure across city agencies."
    />
    <!-- Pre-hydration theme initializer: defaults to light; respects saved user choice without flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('citysync_theme');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch(e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
